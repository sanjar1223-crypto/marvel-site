<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marvel Timeline — Просмотр</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <a href="index.html" class="logo">
        MARVEL<span>TIMELINE</span>
    </a>

    <nav>
        <a href="index.html">Главная</a>
        <a href="movies.html">Фильмы и сериалы</a>
    </nav>

</header>


<main class="watch-page">

    <div class="watch-container">

        <a href="movies.html" class="back-button">
            ← Назад к фильмам
        </a>


        <!-- ПЛЕЕР -->

        <div class="video-player">

            <video
                id="watchVideo"
                controls
            >
                <source
                    id="videoSource"
                    src=""
                    type="video/mp4"
                >

                Ваш браузер не поддерживает видео.
            </video>

        </div>


        <!-- ИНФОРМАЦИЯ О ФИЛЬМЕ -->

        <div class="movie-details">

            <span
                id="watchType"
                class="movie-type">
            </span>


            <h1 id="watchTitle">
                Загрузка...
            </h1>


            <p
                id="watchYear"
                class="movie-year">
            </p>


            <p
                id="watchDescription"
                class="movie-description">
            </p>

        </div>

    </div>

</main>


<footer>

    <p>
        <strong>MARVEL TIMELINE</strong>
    </p>

    <p>
        Fan project
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
