<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marvel Timeline — Персонаж</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <a href="index.html" class="logo logo-link">
        MARVEL<span>TIMELINE</span>
    </a>

    <nav>
        <a href="index.html">Главная</a>
        <a href="movies.html">Фильмы и сериалы</a>
        <a href="characters.html" class="active-nav">Персонажи</a>
    </nav>

</header>


<main class="character-page">

    <div class="character-container">

        <a href="characters.html" class="back-button">
            ← Назад к персонажам
        </a>


        <div class="character-detail-card">

            <div class="character-image-box">

                <img
                    id="characterImage"
                    src=""
                    alt=""
                >

            </div>


            <div class="character-detail-info">

                <span class="character-detail-type">
                    ПЕРСОНАЖ
                </span>

                <h1 id="characterName"></h1>

                <p
                    id="characterDescription"
                    class="character-description">
                </p>


                <div class="character-facts">

                    <div class="character-fact">
                        <span>НАСТОЯЩЕЕ ИМЯ</span>
                        <strong id="realName"></strong>
                    </div>


                    <div class="character-fact">
                        <span>СПОСОБНОСТИ</span>
                        <strong id="powers"></strong>
                    </div>


                    <div class="character-fact">
                        <span>КОМАНДА</span>
                        <strong id="team"></strong>
                    </div>


                    <div class="character-fact">
                        <span>ПЕРВОЕ ПОЯВЛЕНИЕ</span>
                        <strong id="firstAppearance"></strong>
                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<footer>

    <p>
        <strong>MARVEL TIMELINE</strong>
    </p>

    <p>
        Fan project • Not affiliated with Marvel Studios
    </p>

</footer>

    ],

    ],

    "thor": [

        "images/thor-character.jpg",

        "Hulk",

        "Bruce Banner",

    ],

    "spider-man": [

        "Peter Parker",

    ],

    "black-widow": [

        "images/black-widow-character.jpg",

        "Разные версии и союзники",
        "Thor (2011)"
    ]

};


const params = new URLSearchParams(window.location.search);

const key =
    params.get("name") ||
    params.get("hero") ||
    "iron-man";


const character =
    data[key] || data["iron-man"];


document.title =
    "Marvel Timeline — " + character[0];


document.getElementById("characterImage").src =
    character[1];

document.getElementById("characterImage").alt =
    character[0];


document.getElementById("characterName").textContent =
    character[0];


document.getElementById("characterDescription").textContent =
    character[2];


document.getElementById("realName").textContent =
    character[3];


document.getElementById("powers").textContent =
    character[4];


document.getElementById("team").textContent =
    character[5];


document.getElementById("firstAppearance").textContent =
    character[6];

</script>

</body>
</html>
